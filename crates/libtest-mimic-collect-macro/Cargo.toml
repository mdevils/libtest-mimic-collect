[package]
name = "libtest-mimic-collect-macro"
version = "0.4.0"
edition = "2021"
authors = ["Marat Dulin <mdevils@gmail.com>"]
description = "Macro to process test attribute for libtest-mimic-collect"
categories = [
  "development-tools::testing",
]
documentation = "https://docs.rs/libtest-mimic-collect-macro/"
homepage = "https://github.com/mdevils/libtest-mimic-collect"
repository = "https://github.com/mdevils/libtest-mimic-collect"
keywords = ["libtest", "libtest-mimic", "testing"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
doctest = false
proc-macro = true
test = false

[dependencies]
proc-macro2 = "1.0.92"
quote = "1.0.37"
syn = { version = "3.0.5", features = ["full"] }
